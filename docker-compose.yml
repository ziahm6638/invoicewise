name: invoicewise

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoicewise}
      POSTGRES_USER: ${POSTGRES_USER:-invoicewise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoicewise-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-invoicewise} -d ${POSTGRES_DB:-invoicewise}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes pullable images; Chainguard's build, pinned by
    # digest. It ships `mc`, which the healthcheck and minio-init use.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-invoicewise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-invoicewise-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - invoicewise-minio:/data
    healthcheck:
      test:
        - CMD-SHELL
        - MC_HOST_local="http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@localhost:9000" mc ready local
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-invoicewise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-invoicewise-secret}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-invoicewise}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${STORAGE_S3_BUCKET}" &&
        mc anonymous set none "local/$${STORAGE_S3_BUCKET}"

volumes:
  invoicewise-minio:
  invoicewise-postgres:
