name: invoicewise

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoicewise}
      POSTGRES_USER: ${POSTGRES_USER:-invoicewise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoicewise-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-invoicewise} -d ${POSTGRES_DB:-invoicewise}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-invoicewise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-invoicewise-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - invoicewise-minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-invoicewise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-invoicewise-secret}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-invoicewise}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${STORAGE_S3_BUCKET}" &&
        mc anonymous set none "local/$${STORAGE_S3_BUCKET}"

volumes:
  invoicewise-minio:
  invoicewise-postgres:
