name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same authoritative command a developer runs locally:
  # `bun run verify`. It installs from the frozen lockfile, gates lint
  # (including the feature map, paved-path and test-policy checks) and
  # typecheck, proves fresh/upgrade/recovery migrations from the pinned prior
  # schema, builds the dashboard, website, API executable and worker
  # executable, runs the DB-backed verifiers, and runs the e2e journeys
  # (scripts/e2e.ts) against a production build on a per-run database with
  # every provider stubbed and no application `.env`. Unit tests are not part
  # of it: legacy suites run only through `bun run test:legacy`.
  verify:
    name: verify (frozen install, migrations, builds, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # The pinned MinIO image's default command only prints help, so the
      # disposable services are started with explicit server commands. The
      # verification runner then creates the private bucket through the S3 API;
      # no `mc` container and no compose volume is involved.
      - name: Prove the service bootstrap refuses unowned containers
        run: bash scripts/verify/ci-services.sh --self-check

      - name: Start disposable Postgres 17, Redis and MinIO
        run: bash scripts/verify/ci-services.sh

      # The production image ships tesseract for scanned-invoice OCR; the
      # scanned-fixture regression test requires it in CI.
      - name: Install tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # The browser journeys drive Chromium through playwright-core.
      - name: Install Chromium for the e2e journeys
        run: bunx playwright-core install --with-deps chromium

      - name: Verify release
        run: bun run verify

      - name: Upload redacted failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: .verify-artifacts
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # Dependency and secret checks also run as their own job so their result is
  # visible separately from the build (the full `verify` run includes them too). The policy, owner and outstanding advisory inventory
  # are documented in docs/development.md; new high/critical advisories fail the
  # job.
  security:
    name: security (dependency + secret checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Dependency and secret checks
        run: bun run verify:security

      - name: Upload redacted failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: .verify-artifacts
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
