# Kamal deployment for app.invoicewise.uk and api.invoicewise.uk on hp-slice.
# Staging (iw-staging-app.zzapp.uk, hostinger) is the `staging` destination:
# config/deploy.staging.yml is merged over this file by `kamal ... -d staging`.
# Read docs/deployment.md before changing anything here.
service: invoicewise
image: invoicewise

# kamal-proxy stops routing to an old container, then waits this long for its
# in-flight requests before the container gets SIGTERM. The API then hands
# unfinished workflow jobs back to the queue (docs/operations.md#deploys).
drain_timeout: 30
# Earlier release containers kept on the host for `kamal rollback`.
retain_containers: 5

servers:
  # Next.js dashboard. Serves Better Auth (/api/auth) and document uploads.
  web:
    hosts:
      - 100.90.24.83 # hp-slice over Tailscale
    cmd: /app/scripts/deploy/web.sh
    # Hard memory ceiling (docs/operations.md#capacity); observed ~250 MB.
    options:
      memory: 1g
    proxy:
      host: app.invoicewise.uk
      app_port: 3000
      ssl: false
      healthcheck:
        path: /login
        interval: 5
        timeout: 10
  # Bun API with the workflow runner in-process. Applies migrations on boot.
  api:
    hosts:
      - 100.90.24.83
    cmd: /app/scripts/deploy/api.sh
    # Hard memory ceiling for the API, the workflow runner and its bounded
    # PDF/OCR child processes (2 x 320 MB RSS budget); observed ~450 MB idle.
    options:
      memory: 2g
    env:
      clear:
        PORT: 3003
        # Workflow jobs run at once, and TypeSafe calls allowed per UTC day
        # before document processing waits for tomorrow (the spend ceiling).
        WORKFLOW_CONCURRENCY: 4
        TYPESAFE_DAILY_CALL_LIMIT: 2000
        # Queued document processing beyond which intake answers 429.
        INTAKE_MAX_PENDING_PER_WORKSPACE: 200
        INTAKE_MAX_PENDING_TOTAL: 1000
        TYPESAFE_BASE_URL: https://api.typesafe.ai
        # Self-hosted Nango (the nango accessory below). The API reaches it on
        # the kamal network; browsers reach its public host, and Nango returns
        # its Connect UI host in each connect session.
        NANGO_BASE_URL: http://invoicewise-nango:3003
        NANGO_PUBLIC_URL: https://nango.invoicewise.uk
        NANGO_XERO_INTEGRATION_ID: xero
        NANGO_QUICKBOOKS_INTEGRATION_ID: quickbooks
        # Dedicated workspace addresses: <local part>@INBOUND_EMAIL_DOMAIN,
        # received by the Cloudflare Email Worker (docs/inbound-email.md).
        INBOUND_EMAIL_DOMAIN: in.invoicewise.uk
      secret:
        # Invoice extraction and judgments run only in the workflow runner.
        - TYPESAFE_API_KEY
        # The Nango prod environment secret key (NANGO_SECRET_KEY_PROD on the
        # nango accessory): connect sessions, connections and proxied calls.
        - NANGO_SECRET_KEY
        # Bearer token for /ops/metrics, read by ops/monitor.
        - OPS_TOKEN
        # Shared with the Email Worker (wrangler secret); authenticates every
        # POST /inbound/email.
        - INBOUND_EMAIL_SECRET
        # "true" once the receiving address passed its live proof; until then
        # no workspace is shown an address (docs/inbound-email.md#going-live).
        - INBOUND_EMAIL_LIVE
    proxy:
      host: api.invoicewise.uk
      app_port: 3003
      ssl: false
      # Readiness: the database answers. Returns only ok/unavailable.
      healthcheck:
        path: /health/ready
        interval: 5
        timeout: 10

# Kamal runs a registry on the deploying machine (127.0.0.1:5555) and tunnels
# it to the builder and the host over SSH, so no external registry or token is
# involved. The image never leaves the tailnet.
registry:
  server: localhost:5555

builder:
  arch: amd64
  dockerfile: Dockerfile
  context: .
  # Build on hp-slice itself (amd64) instead of emulating on an arm64 laptop.
  remote: ssh://root@100.90.24.83

# Container logs rotate by size so they cannot grow without bound; time-based
# 30-day expiry is not yet enforced (docs/data-lifecycle.md).
logging:
  driver: json-file
  options:
    max-size: 50m
    max-file: 5

volumes:
  # Local document storage shared by the dashboard (uploads) and the API
  # (signed downloads, workflow processing).
  - /mnt/ssd/invoicewise/storage:/data/storage

env:
  clear:
    NODE_ENV: production
    INVOICEWISE_ENVIRONMENT: production
    # Connections per database pool. The api process holds three pools
    # (requests, invoice reads, workflow runner) and web one: at most 32 of
    # Postgres' 100 connections.
    DATABASE_POOL_MAX: 8
    BETTER_AUTH_URL: https://app.invoicewise.uk
    NEXT_PUBLIC_URL: https://app.invoicewise.uk
    NEXT_PUBLIC_API_URL: https://api.invoicewise.uk
    ALLOWED_API_ORIGINS: https://app.invoicewise.uk
    BETTER_AUTH_COOKIE_DOMAIN: .invoicewise.uk
    STORAGE_BACKEND: local
    LOCAL_STORAGE_PATH: /data/storage
    STORAGE_PUBLIC_URL: https://api.invoicewise.uk
    REDIS_URL: redis://invoicewise-redis:6379
    SMTP_HOST: smtp.purelymail.com
    SMTP_PORT: 465
    SMTP_USER: auth@invoicewise.uk
    AUTH_EMAIL_FROM: InvoiceWise <auth@invoicewise.uk>
    LOG_LEVEL: info
  secret:
    - DATABASE_PRIMARY_URL
    - BETTER_AUTH_SECRET
    - SMTP_PASS
    - STORAGE_SIGNING_SECRET
    - MIDDAY_ENCRYPTION_KEY

ssh:
  user: root

accessories:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    host: 100.90.24.83
    # Not published on the host: only reachable on the kamal Docker network as
    # `invoicewise-db`.
    env:
      clear:
        POSTGRES_USER: invoicewise
        POSTGRES_DB: invoicewise
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /mnt/ssd/invoicewise/postgres:/var/lib/postgresql/data
    options:
      shm-size: 256m
  redis:
    image: redis:7.4-alpine
    host: 100.90.24.83
    cmd: redis-server --appendonly yes
    directories:
      - /mnt/ssd/invoicewise/redis:/data
  # Self-hosted Nango (free edition: auth and proxy) for Xero and QuickBooks
  # OAuth. Its own Postgres keeps Nango's schema and upgrades apart from the
  # InvoiceWise database; both are dumped nightly by ops/backup.
  nango-db:
    image: postgres:16.11-alpine
    host: 100.90.24.83
    env:
      clear:
        POSTGRES_USER: nango
        POSTGRES_DB: nango
      secret:
        - POSTGRES_PASSWORD:NANGO_DB_PASSWORD
    directories:
      - /mnt/ssd/invoicewise/nango-postgres:/var/lib/postgresql/data
  nango:
    image: nangohq/nango-server:hosted-0.71.9
    host: 100.90.24.83
    # Loopback only: cloudflared publishes nango.invoicewise.uk (API, OAuth
    # callback) and nango-connect.invoicewise.uk (Connect UI). The admin
    # dashboard is refused on the public host and reached over an SSH tunnel.
    port: 127.0.0.1:3020:3003
    options:
      publish: 127.0.0.1:3021:3009
    env:
      clear:
        SERVER_PORT: 3003
        NANGO_SERVER_URL: https://nango.invoicewise.uk
        NANGO_DASHBOARD_API_URL: /
        FLAG_SERVE_CONNECT_UI: true
        NANGO_CONNECT_UI_PORT: 3009
        NANGO_PUBLIC_CONNECT_URL: https://nango-connect.invoicewise.uk
        FLAG_AUTH_ENABLED: false
        NANGO_DASHBOARD_USERNAME: invoicewise-admin
        NANGO_DB_HOST: invoicewise-nango-db
        NANGO_DB_PORT: 5432
        NANGO_DB_USER: nango
        NANGO_DB_NAME: nango
        NANGO_DB_SSL: false
        NANGO_LOGS_ENABLED: false
        NANGO_PROXY_BASE_URL_OVERRIDE_ENABLED: false
        LOG_LEVEL: info
      secret:
        - NANGO_ENCRYPTION_KEY
        - NANGO_DB_PASSWORD
        - NANGO_DASHBOARD_PASSWORD
        - NANGO_SECRET_KEY_PROD:NANGO_SECRET_KEY
